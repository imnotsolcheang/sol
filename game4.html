<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射擊遊戲 - Sol Cheang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0ff;
            margin-bottom: 15px;
        }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            background-color: #000;
            cursor: none;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        
        .info-box {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(to right, #00dbde, #fc00ff);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            border-left: 4px solid #00dbde;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #00dbde;
        }
        
        .instructions ul {
            list-style-type: none;
            padding-left: 10px;
        }
        
        .instructions li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .key {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 5px;
            font-family: monospace;
            font-weight: bold;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 10;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }
        
        .game-over h2 {
            font-size: 2.5rem;
            color: #ff0055;
            margin-bottom: 15px;
        }
        
        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 25px;
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 2px solid #00dbde;
            box-shadow: 0 0 30px rgba(0, 219, 222, 0.5);
            width: 90%;
            max-width: 500px;
        }
        
        .start-screen h2 {
            font-size: 2.5rem;
            color: #00dbde;
            margin-bottom: 15px;
        }
        
        .start-screen p {
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: #888;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .info-box {
                font-size: 1rem;
                padding: 8px 12px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
            
            .game-over, .start-screen {
                padding: 25px;
                width: 95%;
            }
        }
        
        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>太空射擊遊戲</h1>
            <p class="subtitle">Sol Cheang 動作遊戲系列</p>
        </header>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            
            <div class="ui-overlay">
                <div class="game-info">
                    <div class="info-box">得分: <span id="score">0</span></div>
                    <div class="info-box">生命: <span id="lives">3</span></div>
                    <div class="info-box">關卡: <span id="level">1</span></div>
                </div>
                
                <div class="game-info">
                    <div class="info-box">敵機: <span id="enemies">5</span></div>
                    <div class="info-box">彈藥: <span id="ammo">50</span></div>
                </div>
            </div>
            
            <div id="startScreen" class="start-screen">
                <h2>太空射擊遊戲</h2>
                <p>控制你的太空船，擊落敵機，躲避子彈，生存下來！</p>
                <button id="startBtn" class="btn">開始遊戲</button>
            </div>
            
            <div id="gameOver" class="game-over">
                <h2>遊戲結束</h2>
                <p>最終得分: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">再玩一次</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="pauseBtn" class="btn">暫停遊戲</button>
            <button id="soundBtn" class="btn">音效: 開啟</button>
            <button id="instructionsBtn" class="btn">遊戲說明</button>
        </div>
        
        <div class="instructions">
            <h3>遊戲控制</h3>
            <ul>
                <li>移動: <span class="key">←</span> <span class="key">→</span> 方向鍵 或 <span class="key">A</span> <span class="key">D</span> 鍵</li>
                <li>射擊: <span class="key">空格鍵</span> 或 <span class="key">↑</span> 方向鍵</li>
                <li>暫停: <span class="key">P</span> 鍵 或 點擊暫停按鈕</li>
                <li>遊戲目標: 擊落所有敵機，每關有5波敵機，完成5波進入下一關</li>
                <li>注意: 紅色敵機會射擊，藍色敵機會高速移動，黃色敵機有更多生命值</li>
            </ul>
        </div>
        
        <footer>
            <p>© 2023 Sol Cheang 遊戲系列 | HTML5 Canvas 動作遊戲</p>
        </footer>
    </div>

    <script>
        // 遊戲主變量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const soundBtn = document.getElementById('soundBtn');
        const instructionsBtn = document.getElementById('instructionsBtn');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const enemiesElement = document.getElementById('enemies');
        const ammoElement = document.getElementById('ammo');
        const finalScoreElement = document.getElementById('finalScore');
        
        // 遊戲狀態
        let game = {
            running: false,
            paused: false,
            sound: true,
            score: 0,
            lives: 3,
            level: 1,
            wave: 1,
            maxWaves: 5,
            ammo: 50,
            enemies: []
        };
        
        // 玩家飛船
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 40,
            height: 50,
            speed: 7,
            color: '#00dbde',
            bullets: [],
            lastShot: 0,
            shotDelay: 300 // 毫秒
        };
        
        // 敵人類型
        const enemyTypes = [
            { color: '#ff5555', speed: 2, health: 1, points: 10, shoots: true }, // 紅色 - 會射擊
            { color: '#5555ff', speed: 4, health: 1, points: 15, shoots: false }, // 藍色 - 快速
            { color: '#ffff55', speed: 1.5, health: 3, points: 25, shoots: false } // 黃色 - 高血量
        ];
        
        // 敵人子彈
        let enemyBullets = [];
        
        // 粒子效果 (爆炸)
        let particles = [];
        
        // 遊戲控制
        const keys = {};
        
        // 初始化遊戲
        function init() {
            game.score = 0;
            game.lives = 3;
            game.level = 1;
            game.wave = 1;
            game.ammo = 50;
            player.bullets = [];
            enemyBullets = [];
            particles = [];
            game.enemies = [];
            
            // 生成第一波敵人
            spawnEnemies();
            
            // 更新UI
            updateUI();
            
            // 隱藏遊戲結束畫面，顯示遊戲畫面
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'none';
            
            // 開始遊戲循環
            game.running = true;
            game.paused = false;
            pauseBtn.textContent = '暫停遊戲';
            
            // 啟動遊戲循環
            if (!game.paused) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        // 生成敵人
        function spawnEnemies() {
            game.enemies = [];
            
            // 根據關卡決定敵人數量
            let enemyCount = 5 + Math.floor(game.level * 1.5);
            
            for (let i = 0; i < enemyCount; i++) {
                // 隨機選擇敵人類型
                const typeIndex = Math.floor(Math.random() * enemyTypes.length);
                const type = enemyTypes[typeIndex];
                
                // 隨機位置
                const x = 30 + Math.random() * (canvas.width - 60);
                const y = 30 + Math.random() * 150;
                
                game.enemies.push({
                    x: x,
                    y: y,
                    width: 35,
                    height: 35,
                    speed: type.speed,
                    color: type.color,
                    health: type.health,
                    maxHealth: type.health,
                    points: type.points,
                    shoots: type.shoots,
                    lastShot: 0,
                    shotDelay: 2000 + Math.random() * 2000 // 射擊間隔
                });
            }
        }
        
        // 遊戲主循環
        function gameLoop(timestamp) {
            if (!game.running || game.paused) return;
            
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 繪製星空背景
            drawBackground();
            
            // 更新玩家
            updatePlayer();
            drawPlayer();
            
            // 更新玩家子彈
            updateBullets();
            
            // 更新敵人
            updateEnemies();
            
            // 更新敵人子彈
            updateEnemyBullets();
            
            // 更新粒子效果
            updateParticles();
            
            // 檢查碰撞
            checkCollisions();
            
            // 檢查遊戲狀態
            checkGameState();
            
            // 繼續遊戲循環
            requestAnimationFrame(gameLoop);
        }
        
        // 繪製星空背景
        function drawBackground() {
            // 繪製漸變背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a2a');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 繪製星星
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 100; i++) {
                const x = (i * 13) % canvas.width;
                const y = (i * 7) % canvas.height;
                const size = Math.random() * 2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 更新玩家位置
        function updatePlayer() {
            // 左右移動
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.x += player.speed;
            }
            
            // 限制玩家在畫布內移動
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            
            // 射擊
            if ((keys['Space'] || keys['ArrowUp']) && game.ammo > 0) {
                const currentTime = Date.now();
                if (currentTime - player.lastShot > player.shotDelay) {
                    player.bullets.push({
                        x: player.x + player.width / 2 - 3,
                        y: player.y,
                        width: 6,
                        height: 15,
                        speed: 10,
                        color: '#00ffaa'
                    });
                    
                    player.lastShot = currentTime;
                    game.ammo--;
                    updateUI();
                    
                    // 播放射擊音效
                    if (game.sound) playShootSound();
                }
            }
        }
        
        // 繪製玩家飛船
        function drawPlayer() {
            // 飛船主體
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            
            // 飛船引擎效果
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.ellipse(player.x + player.width / 2, player.y + player.height + 5, 8, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 飛船細節
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + player.width / 2 - 5, player.y + 10, 10, 8);
        }
        
        // 更新子彈
        function updateBullets() {
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const bullet = player.bullets[i];
                bullet.y -= bullet.speed;
                
                // 繪製子彈
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                
                // 添加子彈尾跡
                ctx.fillStyle = 'rgba(0, 255, 170, 0.5)';
                ctx.fillRect(bullet.x + 1, bullet.y + bullet.height, bullet.width - 2, 5);
                
                // 移除超出畫布的子彈
                if (bullet.y < 0) {
                    player.bullets.splice(i, 1);
                }
            }
        }
        
        // 更新敵人
        function updateEnemies() {
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                
                // 移動敵人
                enemy.y += enemy.speed * (0.5 + game.level * 0.1);
                
                // 敵人左右擺動
                enemy.x += Math.sin(Date.now() / 1000 + i) * 1.5;
                
                // 限制敵人在畫布內
                if (enemy.x < 0) enemy.x = 0;
                if (enemy.x > canvas.width - enemy.width) enemy.x = canvas.width - enemy.width;
                
                // 繪製敵人
                drawEnemy(enemy);
                
                // 敵人射擊
                if (enemy.shoots) {
                    const currentTime = Date.now();
                    if (currentTime - enemy.lastShot > enemy.shotDelay) {
                        enemyBullets.push({
                            x: enemy.x + enemy.width / 2 - 2,
                            y: enemy.y + enemy.height,
                            width: 4,
                            height: 10,
                            speed: 5,
                            color: '#ff5555'
                        });
                        
                        enemy.lastShot = currentTime;
                    }
                }
                
                // 移除超出畫布的敵人
                if (enemy.y > canvas.height) {
                    game.enemies.splice(i, 1);
                }
            }
            
            // 更新敵人數量顯示
            enemiesElement.textContent = game.enemies.length;
        }
        
        // 繪製敵人
        function drawEnemy(enemy) {
            // 敵人主體
            ctx.fillStyle = enemy.color;
            ctx.beginPath();
            ctx.ellipse(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2, enemy.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 生命條
            if (enemy.health < enemy.maxHealth) {
                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 4);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width * healthPercent, 4);
            }
            
            // 敵人眼睛
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(enemy.x + enemy.width / 3, enemy.y + enemy.height / 3, 4, 0, Math.PI * 2);
            ctx.arc(enemy.x + 2 * enemy.width / 3, enemy.y + enemy.height / 3, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // 敵人瞳孔
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(enemy.x + enemy.width / 3, enemy.y + enemy.height / 3, 2, 0, Math.PI * 2);
            ctx.arc(enemy.x + 2 * enemy.width / 3, enemy.y + enemy.height / 3, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 更新敵人子彈
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                bullet.y += bullet.speed;
                
                // 繪製子彈
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                
                // 移除超出畫布的子彈
                if (bullet.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }
        }
        
        // 更新粒子效果
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.alpha -= 0.02;
                
                // 繪製粒子
                ctx.globalAlpha = particle.alpha;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 移除透明度為0的粒子
                if (particle.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            ctx.globalAlpha = 1.0;
        }
        
        // 檢查碰撞
        function checkCollisions() {
            // 檢查玩家子彈擊中敵人
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const bullet = player.bullets[i];
                
                for (let j = game.enemies.length - 1; j >= 0; j--) {
                    const enemy = game.enemies[j];
                    
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y) {
                        
                        // 擊中敵人
                        enemy.health--;
                        
                        // 創建擊中效果
                        createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                        
                        // 移除子彈
                        player.bullets.splice(i, 1);
                        
                        // 如果敵人生命值為0，消滅敵人
                        if (enemy.health <= 0) {
                            // 增加分數
                            game.score += enemy.points;
                            
                            // 創建爆炸效果
                            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                            
                            // 有機率掉落彈藥
                            if (Math.random() < 0.3) {
                                createAmmoPickup(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                            }
                            
                            // 移除敵人
                            game.enemies.splice(j, 1);
                            
                            // 播放爆炸音效
                            if (game.sound) playExplosionSound();
                        }
                        
                        updateUI();
                        break;
                    }
                }
            }
            
            // 檢查敵人子彈擊中玩家
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                
                if (bullet.x < player.x + player.width &&
                    bullet.x + bullet.width > player.x &&
                    bullet.y < player.y + player.height &&
                    bullet.y + bullet.height > player.y) {
                    
                    // 擊中玩家
                    game.lives--;
                    updateUI();
                    
                    // 創建擊中效果
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                    
                    // 移除子彈
                    enemyBullets.splice(i, 1);
                    
                    // 播放擊中音效
                    if (game.sound) playHitSound();
                    
                    // 如果生命值為0，遊戲結束
                    if (game.lives <= 0) {
                        gameOver();
                    }
                }
            }
            
            // 檢查玩家撞到敵人
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    // 玩家和敵人都受到傷害
                    game.lives--;
                    enemy.health--;
                    
                    // 創建爆炸效果
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0000');
                    
                    updateUI();
                    
                    // 如果敵人生命值為0，消滅敵人
                    if (enemy.health <= 0) {
                        game.score += enemy.points;
                        game.enemies.splice(i, 1);
                    }
                    
                    // 如果生命值為0，遊戲結束
                    if (game.lives <= 0) {
                        gameOver();
                    }
                    
                    // 播放擊中音效
                    if (game.sound) playHitSound();
                }
            }
            
            // 檢查玩家撿到彈藥
            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];
                
                // 檢查是否是彈藥拾取粒子
                if (particle.isAmmo && 
                    particle.x < player.x + player.width &&
                    particle.x > player.x &&
                    particle.y < player.y + player.height &&
                    particle.y > player.y) {
                    
                    // 增加彈藥
                    game.ammo += 10;
                    updateUI();
                    
                    // 移除粒子
                    particles.splice(i, 1);
                    
                    // 播放拾取音效
                    if (game.sound) playPickupSound();
                    
                    break;
                }
            }
        }
        
        // 創建粒子效果
        function createParticles(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 3 + 1,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    color: color,
                    alpha: 0.8,
                    isAmmo: false
                });
            }
        }
        
        // 創建爆炸效果
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 4 + 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: color,
                    alpha: 1.0,
                    isAmmo: false
                });
            }
        }
        
        // 創建彈藥拾取
        function createAmmoPickup(x, y) {
            particles.push({
                x: x,
                y: y,
                size: 8,
                vx: 0,
                vy: 2,
                color: '#00ffaa',
                alpha: 1.0,
                isAmmo: true
            });
        }
        
        // 檢查遊戲狀態
        function checkGameState() {
            // 檢查是否消滅了所有敵人
            if (game.enemies.length === 0) {
                // 完成一波敵人
                game.wave++;
                
                // 如果完成了所有波數，進入下一關
                if (game.wave > game.maxWaves) {
                    game.level++;
                    game.wave = 1;
                    
                    // 增加獎勵生命
                    if (game.level % 2 === 0) {
                        game.lives++;
                    }
                }
                
                // 生成新一波敵人
                spawnEnemies();
                updateUI();
                
                // 補充部分彈藥
                game.ammo = Math.min(game.ammo + 20, 100);
                updateUI();
            }
        }
        
        // 遊戲結束
        function gameOver() {
            game.running = false;
            finalScoreElement.textContent = game.score;
            gameOverScreen.style.display = 'block';
            
            // 播放遊戲結束音效
            if (game.sound) playGameOverSound();
        }
        
        // 更新UI
        function updateUI() {
            scoreElement.textContent = game.score;
            livesElement.textContent = game.lives;
            levelElement.textContent = game.level;
            enemiesElement.textContent = game.enemies.length;
            ammoElement.textContent = game.ammo;
        }
        
        // 音效函數（使用Web Audio API模擬音效）
        function playShootSound() {
            // 簡單的音效生成
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }
        
        function playExplosionSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(100, audioContext.currentTime);
                oscillator.type = 'sawtooth';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }
        
        function playHitSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                oscillator.type = 'triangle';
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }
        
        function playPickupSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }
        
        function playGameOverSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 播放兩個音符
                for (let i = 0; i < 2; i++) {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(i === 0 ? 220 : 110, audioContext.currentTime + i * 0.3); // A3, A2
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + i * 0.3);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + (i * 0.3) + 0.5);
                    
                    oscillator.start(audioContext.currentTime + i * 0.3);
                    oscillator.stop(audioContext.currentTime + (i * 0.3) + 0.5);
                }
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }
        
        // 事件監聽器
        startBtn.addEventListener('click', init);
        
        restartBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            init();
        });
        
        pauseBtn.addEventListener('click', () => {
            if (game.running) {
                game.paused = !game.paused;
                pauseBtn.textContent = game.paused ? '繼續遊戲' : '暫停遊戲';
                
                if (!game.paused) {
                    requestAnimationFrame(gameLoop);
                }
            }
        });
        
        soundBtn.addEventListener('click', () => {
            game.sound = !game.sound;
            soundBtn.textContent = game.sound ? '音效: 開啟' : '音效: 關閉';
        });
        
        instructionsBtn.addEventListener('click', () => {
            alert('遊戲控制:\n\n移動: 方向鍵 ← → 或 A D 鍵\n射擊: 空格鍵 或 ↑ 方向鍵\n暫停: P 鍵\n\n遊戲目標: 擊落所有敵機，每關有5波敵機，完成5波進入下一關。\n注意: 紅色敵機會射擊，藍色敵機會高速移動，黃色敵機有更多生命值。');
        });
        
        // 鍵盤控制
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // 防止空格鍵滾動頁面
            if (e.code === 'Space') {
                e.preventDefault();
            }
            
            // P鍵暫停遊戲
            if (e.code === 'KeyP' && game.running) {
                game.paused = !game.paused;
                pauseBtn.textContent = game.paused ? '繼續遊戲' : '暫停遊戲';
                
                if (!game.paused) {
                    requestAnimationFrame(gameLoop);
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // 初始顯示開始畫面
        startScreen.style.display = 'block';
        
        // 防止上下文選單
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        console.log("遊戲載入完成！點擊開始遊戲按鈕開始遊玩。");
    </script>
</body>
</html>
