<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff9a00, #ff5252);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }
        
        .score-container, .best-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
            min-width: 150px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .score-label, .best-label {
            font-size: 1rem;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .score, .best {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }
        
        .instructions {
            margin-top: 10px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            max-width: 500px;
            line-height: 1.5;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .grid-container {
            position: relative;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .grid-row {
            display: flex;
            margin-bottom: 15px;
        }
        
        .grid-row:last-child {
            margin-bottom: 0;
        }
        
        .grid-cell {
            width: 100px;
            height: 100px;
            margin-right: 15px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .grid-cell:last-child {
            margin-right: 0;
        }
        
        .tile {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.15s ease-out;
            z-index: 10;
            animation: appear 0.2s ease-out;
        }
        
        @keyframes appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .tile-merged {
            animation: pop 0.3s ease-out;
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* 不同数字的颜色 */
        .tile-2 { background-color: #2A9D8F; color: #fff; }
        .tile-4 { background-color: #E9C46A; color: #fff; }
        .tile-8 { background-color: #F4A261; color: #fff; }
        .tile-16 { background-color: #E76F51; color: #fff; }
        .tile-32 { background-color: #9D4EDD; color: #fff; }
        .tile-64 { background-color: #7209B7; color: #fff; }
        .tile-128 { background-color: #3A86FF; color: #fff; box-shadow: 0 0 20px rgba(58, 134, 255, 0.5); }
        .tile-256 { background-color: #FF006E; color: #fff; box-shadow: 0 0 25px rgba(255, 0, 110, 0.5); }
        .tile-512 { background-color: #FB5607; color: #fff; box-shadow: 0 0 30px rgba(251, 86, 7, 0.5); }
        .tile-1024 { background-color: #FFBE0B; color: #fff; box-shadow: 0 0 35px rgba(255, 190, 11, 0.5); font-size: 1.8rem; }
        .tile-2048 { background-color: #00BBF9; color: #fff; box-shadow: 0 0 40px rgba(0, 187, 249, 0.7); font-size: 1.8rem; }
        .tile-super { background-color: #00F5D4; color: #fff; box-shadow: 0 0 45px rgba(0, 245, 212, 0.8); font-size: 1.6rem; }
        
        .game-message {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .game-message p {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .win-message {
            color: #4CAF50;
        }
        
        .game-over-message {
            color: #FF5252;
        }
        
        .restart-button {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .restart-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .control-buttons {
            display: flex;
            gap: 20px;
        }
        
        .control-button {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            padding: 12px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        .control-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            width: 100%;
            max-width: 500px;
        }
        
        .mobile-controls {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 300px;
        }
        
        .mobile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            height: 300px;
        }
        
        .mobile-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .mobile-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .mobile-btn.up { grid-column: 2; grid-row: 1; }
        .mobile-btn.left { grid-column: 1; grid-row: 2; }
        .mobile-btn.right { grid-column: 3; grid-row: 2; }
        .mobile-btn.down { grid-column: 2; grid-row: 3; }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .grid-cell, .tile {
                width: 70px;
                height: 70px;
            }
            
            .tile {
                font-size: 1.5rem;
            }
            
            .tile-1024, .tile-2048 {
                font-size: 1.3rem;
            }
            
            .mobile-controls {
                display: block;
            }
            
            .control-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .game-info {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }
        
        /* 開始畫面樣式 */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 10px;
        }
        
        .start-screen h2 {
            font-size: 3.5rem;
            color: #ff9a00;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 154, 0, 0.7);
            background: linear-gradient(45deg, #ff9a00, #ff5252);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .start-screen p {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        
        .start-screen .key-hint {
            font-size: 1.2rem;
            color: #4cc9f0;
            padding: 10px 20px;
            background-color: rgba(76, 201, 240, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            margin-top: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        @media (max-width: 400px) {
            .grid-cell, .tile {
                width: 60px;
                height: 60px;
            }
            
            .tile {
                font-size: 1.2rem;
            }
            
            .start-screen h2 {
                font-size: 2.5rem;
            }
            
            .start-screen p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>2048</h1>
            <p class="instructions">使用键盘方向键或屏幕按钮移动方块。当两个相同数字的方块碰撞时，它们会合并成一个数字翻倍的方块！</p>
        </header>
        
        <div class="game-info">
            <div class="score-container">
                <div class="score-label">分数</div>
                <div class="score" id="score">0</div>
            </div>
            
            <div class="best-container">
                <div class="best-label">最高分</div>
                <div class="best" id="best">0</div>
            </div>
        </div>
        
        <div class="game-container">
            <!-- 開始畫面 -->
            <div id="start-screen" class="start-screen">
                <h2>2048 遊戲</h2>
                <p>使用方向鍵移動方塊，合併相同數字以達到2048！</p>
                <p class="key-hint">按任意鍵開始遊戲</p>
            </div>
            
            <div class="grid-container">
                <!-- 4x4网格 -->
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                
                <!-- 游戏消息 -->
                <div class="game-message" id="game-message">
                    <p id="message-text"></p>
                    <button class="restart-button" id="restart-button">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 移动端控制按钮 -->
        <div class="mobile-controls">
            <div class="mobile-grid">
                <button class="mobile-btn up" id="up-btn">
                    <i class="fas fa-arrow-up"></i>
                </button>
                <button class="mobile-btn left" id="left-btn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button class="mobile-btn right" id="right-btn">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button class="mobile-btn down" id="down-btn">
                    <i class="fas fa-arrow-down"></i>
                </button>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-buttons">
                <button class="control-button" id="new-game-btn">
                    <i class="fas fa-plus-circle"></i> 新游戏
                </button>
                <button class="control-button" id="undo-btn">
                    <i class="fas fa-undo"></i> 撤销
                </button>
                <button class="control-button" id="how-to-play-btn">
                    <i class="fas fa-question-circle"></i> 游戏规则
                </button>
            </div>
        </div>
        
        <footer>
            <p>使用键盘方向键 ↑ ↓ ← → 或屏幕上的方向按钮移动方块。目标是获得 2048 方块！</p>
            <p style="margin-top: 10px;">游戏设计灵感来自原始 2048 游戏</p>
        </footer>
    </div>

    <script>
        // 游戏状态变量
        let grid = [];
        let score = 0;
        let bestScore = localStorage.getItem('2048-best-score') || 0;
        let gameOver = false;
        let gameWon = false;
        let moved = false;
        let previousState = null;
        
        // DOM 元素
        const gridContainer = document.querySelector('.grid-container');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');
        const gameMessage = document.getElementById('game-message');
        const messageText = document.getElementById('message-text');
        const restartButton = document.getElementById('restart-button');
        const newGameButton = document.getElementById('new-game-btn');
        const undoButton = document.getElementById('undo-btn');
        const howToPlayButton = document.getElementById('how-to-play-btn');
        const startScreen = document.getElementById('start-screen');
        
        // 移动端控制按钮
        const upButton = document.getElementById('up-btn');
        const downButton = document.getElementById('down-btn');
        const leftButton = document.getElementById('left-btn');
        const rightButton = document.getElementById('right-btn');
        
        // 遊戲狀態
        let gameStarted = false;
        
        // 開始遊戲
        function startGame() {
            if (!gameStarted) {
                startScreen.style.display = 'none';
                gameStarted = true;
                initGame();
            }
        }
        
        // 初始化游戏
        function initGame() {
            // 初始化网格
            grid = [];
            for (let i = 0; i < 4; i++) {
                grid[i] = [];
                for (let j = 0; j < 4; j++) {
                    grid[i][j] = 0;
                }
            }
            
            score = 0;
            gameOver = false;
            gameWon = false;
            previousState = null;
            
            updateScore();
            updateBestScore();
            clearGrid();
            addRandomTile();
            addRandomTile();
            updateGrid();
            
            hideMessage();
        }
        
        // 清除网格中的所有方块
        function clearGrid() {
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                tile.remove();
            });
        }
        
        // 更新网格显示
        function updateGrid() {
            clearGrid();
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] !== 0) {
                        createTile(i, j, grid[i][j]);
                    }
                }
            }
        }
        
        // 创建方块元素
        function createTile(row, col, value) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${value}`;
            tile.textContent = value;
            
            // 设置位置
            const x = col * 115 + 15; // 100px宽度 + 15px间距
            const y = row * 115 + 15;
            
            tile.style.left = `${x}px`;
            tile.style.top = `${y}px`;
            
            // 对于大于2048的数字，使用特殊样式类
            if (value > 2048) {
                tile.classList.add('tile-super');
            }
            
            gridContainer.appendChild(tile);
        }
        
        // 添加随机方块（90%概率为2，10%概率为4）
        function addRandomTile() {
            const emptyCells = [];
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        emptyCells.push({row: i, col: j});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                
                grid[randomCell.row][randomCell.col] = value;
                createTile(randomCell.row, randomCell.col, value);
            }
        }
        
        // 保存游戏状态（用于撤销功能）
        function saveState() {
            previousState = {
                grid: JSON.parse(JSON.stringify(grid)),
                score: score
            };
        }
        
        // 撤销上一步
        function undo() {
            if (previousState) {
                grid = JSON.parse(JSON.stringify(previousState.grid));
                score = previousState.score;
                previousState = null;
                
                updateScore();
                updateGrid();
                hideMessage();
                gameOver = false;
                gameWon = false;
            }
        }
        
        // 更新分数显示
        function updateScore() {
            scoreDisplay.textContent = score;
            
            // 更新最高分
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('2048-best-score', bestScore);
                updateBestScore();
            }
        }
        
        // 更新最高分显示
        function updateBestScore() {
            bestDisplay.textContent = bestScore;
        }
        
        // 显示游戏消息
        function showMessage(message, isWin) {
            messageText.textContent = message;
            messageText.className = isWin ? 'win-message' : 'game-over-message';
            gameMessage.style.display = 'flex';
        }
        
        // 隐藏游戏消息
        function hideMessage() {
            gameMessage.style.display = 'none';
        }
        
        // 移动方块
        function move(direction) {
            if (gameOver) return false;
            
            saveState();
            
            moved = false;
            const oldGrid = JSON.parse(JSON.stringify(grid));
            
            switch(direction) {
                case 'up':
                    moveUp();
                    break;
                case 'down':
                    moveDown();
                    break;
                case 'left':
                    moveLeft();
                    break;
                case 'right':
                    moveRight();
                    break;
            }
            
            // 如果移动有效，添加新方块并检查游戏状态
            if (moved) {
                // 添加合并动画
                const tiles = document.querySelectorAll('.tile');
                tiles.forEach(tile => {
                    tile.classList.remove('tile-merged');
                });
                
                setTimeout(() => {
                    addRandomTile();
                    updateGrid();
                    
                    // 添加合并动画
                    const newTiles = document.querySelectorAll('.tile');
                    newTiles.forEach(tile => {
                        if (!arraysEqual(oldGrid, grid)) {
                            tile.classList.add('tile-merged');
                        }
                    });
                    
                    checkGameState();
                }, 150);
                
                return true;
            }
            
            previousState = null; // 如果没有移动，不保存状态
            return false;
        }
        
        // 向上移动
        function moveUp() {
            for (let j = 0; j < 4; j++) {
                let column = [];
                for (let i = 0; i < 4; i++) {
                    if (grid[i][j] !== 0) {
                        column.push(grid[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let i = 0; i < column.length - 1; i++) {
                    if (column[i] === column[i + 1]) {
                        column[i] *= 2;
                        column[i + 1] = 0;
                        score += column[i];
                        moved = true;
                    }
                }
                
                // 移除零值
                column = column.filter(value => value !== 0);
                
                // 补全零值
                while (column.length < 4) {
                    column.push(0);
                }
                
                // 更新网格
                for (let i = 0; i < 4; i++) {
                    if (grid[i][j] !== column[i]) {
                        moved = true;
                    }
                    grid[i][j] = column[i];
                }
            }
        }
        
        // 向下移动
        function moveDown() {
            for (let j = 0; j < 4; j++) {
                let column = [];
                for (let i = 3; i >= 0; i--) {
                    if (grid[i][j] !== 0) {
                        column.push(grid[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let i = 0; i < column.length - 1; i++) {
                    if (column[i] === column[i + 1]) {
                        column[i] *= 2;
                        column[i + 1] = 0;
                        score += column[i];
                        moved = true;
                    }
                }
                
                // 移除零值
                column = column.filter(value => value !== 0);
                
                // 补全零值
                while (column.length < 4) {
                    column.push(0);
                }
                
                // 更新网格
                for (let i = 3; i >= 0; i--) {
                    const value = column[3 - i];
                    if (grid[i][j] !== value) {
                        moved = true;
                    }
                    grid[i][j] = value;
                }
            }
        }
        
        // 向左移动
        function moveLeft() {
            for (let i = 0; i < 4; i++) {
                let row = [];
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] !== 0) {
                        row.push(grid[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        row[j + 1] = 0;
                        score += row[j];
                        moved = true;
                    }
                }
                
                // 移除零值
                row = row.filter(value => value !== 0);
                
                // 补全零值
                while (row.length < 4) {
                    row.push(0);
                }
                
                // 更新网格
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] !== row[j]) {
                        moved = true;
                    }
                    grid[i][j] = row[j];
                }
            }
        }
        
        // 向右移动
        function moveRight() {
            for (let i = 0; i < 4; i++) {
                let row = [];
                for (let j = 3; j >= 0; j--) {
                    if (grid[i][j] !== 0) {
                        row.push(grid[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        row[j + 1] = 0;
                        score += row[j];
                        moved = true;
                    }
                }
                
                // 移除零值
                row = row.filter(value => value !== 0);
                
                // 补全零值
                while (row.length < 4) {
                    row.push(0);
                }
                
                // 更新网格
                for (let j = 3; j >= 0; j--) {
                    const value = row[3 - j];
                    if (grid[i][j] !== value) {
                        moved = true;
                    }
                    grid[i][j] = value;
                }
            }
        }
        
        // 检查游戏状态
        function checkGameState() {
            updateScore();
            
            // 检查是否获胜
            if (!gameWon) {
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (grid[i][j] === 2048) {
                            gameWon = true;
                            showMessage('恭喜！你获得了2048！', true);
                            return;
                        }
                    }
                }
            }
            
            // 检查是否还有空单元格
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        return; // 还有空单元格，游戏继续
                    }
                }
            }
            
            // 检查是否还能移动
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const current = grid[i][j];
                    
                    // 检查右边单元格
                    if (j < 3 && grid[i][j + 1] === current) {
                        return; // 可以向右合并
                    }
                    
                    // 检查下边单元格
                    if (i < 3 && grid[i + 1][j] === current) {
                        return; // 可以向下合并
                    }
                }
            }
            
            // 游戏结束
            gameOver = true;
            showMessage('游戏结束！', false);
        }
        
        // 工具函数：比较两个数组是否相等
        function arraysEqual(a, b) {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (a[i][j] !== b[i][j]) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        // 事件监听器
        document.addEventListener('keydown', function(event) {
            // 如果遊戲還沒開始，按任意鍵開始遊戲
            if (!gameStarted) {
                startGame();
                return;
            }
            
            if (gameOver && !gameWon) return;
            
            switch(event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    move('up');
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    move('down');
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    move('left');
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    move('right');
                    break;
            }
        });
        
        // 移动端控制按钮事件
        upButton.addEventListener('click', () => move('up'));
        downButton.addEventListener('click', () => move('down'));
        leftButton.addEventListener('click', () => move('left'));
        rightButton.addEventListener('click', () => move('right'));
        
        // 按钮事件
        restartButton.addEventListener('click', initGame);
        newGameButton.addEventListener('click', initGame);
        undoButton.addEventListener('click', undo);
        
        howToPlayButton.addEventListener('click', function() {
            alert('游戏规则：\n\n1. 使用键盘方向键或屏幕按钮移动方块\n2. 当两个相同数字的方块碰撞时，它们会合并成一个数字翻倍的方块\n3. 每次移动后，会在空白处随机生成一个2或4的方块\n4. 目标是合并出2048方块\n5. 当棋盘填满且无法合并时，游戏结束');
        });
        
        // 點擊開始畫面開始遊戲
        startScreen.addEventListener('click', startGame);
        
        // 初始顯示開始畫面
        startScreen.style.display = 'flex';
    </script>
</body>
