<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Cheang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { 
            margin-bottom: 40px;
            color: #4dabf7;
        }
        
        /* 分類樣式 */
        .category {
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .category-title {
            font-size: 1.5em;
            color: #ffa94d;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 2px solid #3d3d5c;
            padding-bottom: 10px;
        }
        
        /* 遊戲卡片樣式 */
        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .game-card {
            background: #2d2d44;
            padding: 25px 35px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            min-width: 150px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .game-card:hover { 
            background: #3d3d5c; 
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .icon { 
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .game-name {
            font-size: 1.1em;
        }
        
        /* 響應式設計 */
        @media (max-width: 600px) {
            .game-card {
                padding: 20px 25px;
                min-width: 120px;
            }
            .category-title {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>🎮 Sol Cheang</h1>
    
    <!-- 經典遊戲分類 -->
    <div class="category">
        <h2 class="category-title">🎯 經典遊戲</h2>
        <div class="games-container">
            <a href="games/snake/index.html" class="game-card">
                <div class="icon">🐍</div>
                <div class="game-name">貪食蛇遊戲 (增強版)</div>
            </a>
            <a href="game3.html" class="game-card">
                <div class="icon">🔢</div>
                <div class="game-name">數獨</div>
            </a>
        </div>
    </div>
    
    <!-- 益智遊戲分類 -->
    <div class="category">
        <h2 class="category-title">🧩 益智遊戲</h2>
        <div class="games-container">
            <a href="game2.html" class="game-card">
                <div class="icon">🧮</div>
                <div class="game-name">2048</div>
            </a>
        </div>
    </div>
    
    <!-- 動作遊戲分類 -->
    <div class="category">
        <h2 class="category-title">⚡ 動作遊戲</h2>
        <div class="games-container">
            <a href="game4.html" class="game-card">
                <div class="icon">🚀</div>
                <div class="game-name">太空射擊遊戲</div>
            </a>
        </div>
    </div>
    
    <!-- 休閒遊戲分類 -->
    <div class="category">
        <h2 class="category-title">🎲 休閒遊戲</h2>
        <div class="games-container">
            <a href="game5.html" class="game-card">
                <div class="icon">🎣</div>
                <div class="game-name">釣魚達人</div>
            </a>
        </div>
    </div>
    
    <!-- 開發中遊戲 -->
    <div class="category">
        <h2 class="category-title">🔧 開發中遊戲</h2>
        <div class="games-container">
            <a href="#" class="game-card" style="opacity: 0.7;">
                <div class="icon">🔄</div>
                <div class="game-name">更多遊戲即將推出</div>
            </a>
        </div>
    </div>

</body>
</html>
